:root{
  --bg:#000;
  --fg:#fafafa;
  --muted:rgba(255,255,255,.64);
  --faint:rgba(255,255,255,.45);
  --line:rgba(255,255,255,.11);
  --card:#141414;
  --accent:#10b981;
  --sans:Inter,"PingFang SC","HarmonyOS Sans SC",MiSans,"Microsoft YaHei",system-ui,sans-serif;
  --head:Poppins,var(--sans);
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.6,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto;z-index:50;transition:background .35s var(--ease),backdrop-filter .35s var(--ease)}
.nav::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.82),rgba(0,0,0,.34) 58%,transparent)}
.nav.scrolled{background:rgba(0,0,0,.72);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border-bottom:1px solid var(--line)}
.nav-in{position:relative;display:flex;align-items:center;gap:8px;height:64px;max-width:1152px;margin:0 auto;padding:0 24px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--fg);flex-shrink:0}
.brand img{width:26px;height:26px;object-fit:contain;display:block}
.brand span{font:600 15px/1 var(--head);letter-spacing:-.01em}
.links{display:flex;gap:2px;margin-left:14px}
.links a{font:500 13.5px/1 var(--head);letter-spacing:-.01em;color:rgba(255,255,255,.66);text-decoration:none;padding:8px 10px;border-radius:6px;transition:color .2s,background .2s}
.links a:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;border:1px solid transparent;font:500 12.5px/1 var(--sans);text-decoration:none;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .2s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:#fafafa;color:#0a0a0a}
.btn.solid:hover{background:#e5e5e5}
.btn.ghost{border-color:var(--line);background:rgba(255,255,255,.03);color:rgba(255,255,255,.86)}
.btn.ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.btn.lg{height:40px;padding:0 18px;font-size:13.5px}
.star svg{width:13px;height:13px;fill:currentColor}
.lang{display:flex;align-items:center;gap:1px;padding:2px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03)}
.lang button{border:0;background:none;color:rgba(255,255,255,.5);font:500 11.5px/1 var(--sans);padding:6px 9px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.lang button.on{background:rgba(255,255,255,.10);color:#fff}
.menu{display:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#fff;border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center;cursor:pointer}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden}
.board{position:absolute;inset:-4% -2%;will-change:transform;transform:translate3d(0,0,0)}
.board.dragging{cursor:grabbing}
.card{position:absolute;left:var(--l);top:var(--t);width:var(--w);margin:0}
.card .ph{position:relative;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 18px 50px rgba(0,0,0,.55)}
.card .ph::after{content:"";position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.card.portrait .ph{aspect-ratio:3/4}
.card.land .ph{aspect-ratio:3/2}
.p1{--l:3.5%;--t:-1%;--w:15.4%;max-width:235px}
.p2{--l:22%;--t:16%;--w:12%;max-width:185px}
.pf{--l:38.3%;--t:10%;--w:12%;max-width:185px}
.p3{--l:52%;--t:1%;--w:16.7%;max-width:250px}
.p7{--l:31%;--t:43.5%;--w:11.5%;max-width:170px}
.p9{--l:12.5%;--t:47%;--w:14%;max-width:210px}
.p7 .cap,.p9 .cap{display:none}
.p4{--l:-2%;--t:55%;--w:13.4%;max-width:205px}
.p5{--l:22%;--t:55%;--w:15.4%;max-width:235px}
.p6{--l:66%;--t:74%;--w:13.4%;max-width:205px}
.p8{--l:96.8%;--t:8%;--w:13%;max-width:200px}
.p3 .cap{display:none}
.soft .ph{filter:blur(26px) saturate(1.15);opacity:.62;transform:scale(1.04)}
.soft .cap{display:none}
.card .cap{margin-top:9px}
.card .cap b{display:block;font:500 11.5px/1.4 var(--sans);color:rgba(255,255,255,.9);letter-spacing:.005em}
.card .cap i{display:block;font:400 10.5px/1.5 var(--mono);font-style:normal;color:rgba(255,255,255,.45);letter-spacing:.02em}
.card .cap i em{font-style:normal;color:var(--accent);letter-spacing:.06em}
.card.window{left:auto;right:4.2%;top:13.5%;width:34%;max-width:530px}
.card.window .ph{aspect-ratio:1262/838;border-radius:16px;box-shadow:0 40px 100px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.10)}
.card.window .cap{display:flex;justify-content:space-between;gap:12px}

.hero-fade{position:absolute;inset:auto 0 0;height:40%;pointer-events:none;background:linear-gradient(to top,#000 0%,rgba(0,0,0,.94) 26%,rgba(0,0,0,.72) 52%,rgba(0,0,0,.3) 78%,transparent 100%)}
.hero-in{position:relative;z-index:2;width:100%;max-width:1152px;margin:0 auto;padding:0 24px 56px}
.hero-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:end}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;font:400 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,.14)}
h1{margin:0;font:600 clamp(32px,3.9vw,54px)/1.06 var(--head);letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:normal}
.hero-side{padding-bottom:6px;max-width:400px;justify-self:end}
.lede{margin:0 0 22px;font:400 15px/1.65 var(--sans);color:var(--muted);text-wrap:pretty}
.cta{display:flex;flex-wrap:wrap;gap:8px}
.micro{margin:16px 0 0;font:400 10.5px/1.5 var(--mono);letter-spacing:.04em;color:rgba(255,255,255,.38)}
.hint{position:absolute;right:24px;top:88px;z-index:3;display:flex;align-items:center;gap:7px;font:400 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);pointer-events:none;transition:opacity .5s}
.hint svg{width:12px;height:12px}
.hint.off{opacity:0}

/* ---------- next section peek ---------- */
.peek{position:relative;padding:104px 0 24px;background:var(--bg)}
.wrap{max-width:1152px;margin:0 auto;padding:0 24px}
.peek h2{margin:0 0 34px;font:600 clamp(28px,3vw,38px)/1.1 var(--head);letter-spacing:-.02em}
.peek .window{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:0 40px 120px rgba(0,0,0,.6)}
.peek .window img{display:block;width:100%;height:auto}
.peek .micro{margin-top:14px}

@media (max-width:900px){
  .links{display:none}
  .star{display:none}
  .menu{display:none}
  .nav-in{padding:0 18px;gap:10px}
  .brand span{display:none}
  .hero-row{grid-template-columns:1fr;gap:20px}
  .hero-side{justify-self:start;max-width:520px}
  .board{inset:0}
  .card.window{display:none}
  .card.p2,.card.p4,.card.p6{display:none}
  .card.p1{left:2%;top:3%;width:40%;max-width:none}
  .card.pf{left:55%;top:12%;width:38%;max-width:none}
  .card.p3{left:10%;top:40%;width:50%;max-width:none}
  .card.p5{display:none}
  .card .cap b{font-size:11px}
  .card .cap i{font-size:10px}
  .hero-fade{position:absolute;inset:auto 0 0;height:40%;pointer-events:none;background:linear-gradient(to top,#000 0%,rgba(0,0,0,.94) 26%,rgba(0,0,0,.72) 52%,rgba(0,0,0,.3) 78%,transparent 100%)}
  .hero-in{padding-bottom:30px}
  h1{font-size:clamp(30px,8.6vw,38px)}
  .peek{padding-top:64px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>

    board.style.cursor='grab';
    board.addEventListener('pointerdown',function(e){
      dragging=true;board.classList.add('dragging');board.style.cursor='grabbing';
      startX=e.clientX;startY=e.clientY;ox=x;oy=y;
      board.setPointerCapture(e.pointerId);
      if(!used){used=true;hint.classList.add('off');}
    });
    board.addEventListener('pointermove',function(e){
      if(!dragging)return;
      x=Math.max(-LIMIT,Math.min(LIMIT,ox+(e.clientX-startX)));
      y=Math.max(-LIMIT,Math.min(LIMIT,oy+(e.clientY-startY)));
      board.style.transform='translate3d('+x+'px,'+y+'px,0)';
    });
    ['pointerup','pointercancel'].forEach(function(t){
      board.addEventListener(t,function(){
        dragging=false;board.classList.remove('dragging');board.style.cursor='grab';
      });
    });
  }

  var btns=document.querySelectorAll('.lang button');
  function setLang(lang){
    document.documentElement.lang=lang==='zh'?'zh-CN':'en';
    document.querySelectorAll('[data-zh]').forEach(function(el){
      el.innerHTML=el.getAttribute('data-'+lang);
    });
    btns.forEach(function(b){b.classList.toggle('on',b.dataset.lang===lang);});
  }
  btns.forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.lang);});});
})();
</script>
</body>
</html>
